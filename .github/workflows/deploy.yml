# Deploys the API to Lightsail.
#
# The WEB app is not deployed here. It is built and served by Vercel, which
# deploys itself from the same push, so this workflow builds and restarts the
# API only. Restarting a web process here too would leave a second frontend
# running against the same database, quietly serving whatever the last server
# build produced while Vercel serves the real one.
name: Deploy ADYSRE Production

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc


      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false


      - name: Verify tools
        run: |
          node -v
          pnpm -v


      - name: Install dependencies
        run: pnpm install --frozen-lockfile


      - name: Generate Prisma Client
        run: pnpm db:generate


      # The whole workspace, as a build check. This runs on the runner and is
      # thrown away; it exists so a broken web build fails the pipeline here
      # rather than only showing up in Vercel's own deployment.
      - name: Build ADYSRE
        run: pnpm build


      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            cd /home/ubuntu/Adysre

            git pull origin main

            pnpm install --frozen-lockfile

            pnpm db:generate

            # API only. `--filter` still builds what the API depends on, so
            # @adysre/database (prisma generate) and the shared packages are
            # covered; it just skips the web app, which Vercel owns and which is
            # by far the longest part of a full build.
            pnpm turbo run build --filter=@adysre/api

            pm2 restart adysre-api

            pm2 save